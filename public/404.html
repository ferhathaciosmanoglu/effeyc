<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0d">
<title>Sayfa bulunamadı — effeyc</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;background:#0b0b0d;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(60% 50% at 20% 0%,rgba(255,106,26,.22),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(255,255,255,.06),transparent 70%)}
  main{width:min(100%,460px);text-align:center;padding:40px 28px;border-radius:28px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 60px -30px rgba(0,0,0,.8)}
  img{width:52px;height:auto;margin:0 auto 22px;display:block}
  .code{font-size:13px;letter-spacing:.2em;color:#ffb26b;font-weight:600}
  h1{margin:10px 0 10px;font-size:28px;letter-spacing:-.03em;line-height:1.15}
  p{color:#a1a1aa;font-size:15px;line-height:1.6}
  a{display:inline-flex;align-items:center;justify-content:center;margin-top:26px;height:48px;padding:0 24px;border-radius:999px;background:#f4f4f5;color:#111113;font-weight:600;font-size:15px;text-decoration:none}
  a:focus-visible{outline:2px solid #ff6a1a;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="" style="filter:invert(1) brightness(1.4)">
  <div class="code">404</div>
  <h1>Aradığınız sayfa bulunamadı</h1>
  <p>Bağlantı değişmiş ya da sayfa kaldırılmış olabilir. Ana sayfadan devam edebilirsiniz.</p>
  <a href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
